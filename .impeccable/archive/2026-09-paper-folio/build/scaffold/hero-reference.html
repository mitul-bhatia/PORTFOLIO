<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-b-path-field.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#e8e3cd}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-paper-texture region texture" data-region="paper-texture" style="background-image:url('../../../assets/plates/paper-texture.png');background-repeat:repeat"></div>
  <div class="r-masthead region chrome" data-region="masthead"><!-- thin top masthead with brand, role, navigation, and bottom rule --></div>
  <div class="r-brand-label region text" data-region="brand-label"><!-- MITUL BHATIA and AI SYSTEMS ENGINEER masthead labels --><p style="font-size:var(--r-brand-label-font);line-height:1.05;margin:0">brand-label</p></div>
  <div class="r-nav-labels region text" data-region="nav-labels"><!-- WORK ABOUT NOTES CONTACT navigation labels --><p style="font-size:var(--r-nav-labels-font);line-height:1.05;margin:0">nav-labels</p></div>
  <div class="r-ambient-left-paths region chrome" data-region="ambient-left-paths"><!-- responsive interface path fragments and amber state nodes --></div>
  <div class="r-left-annotation region text" data-region="left-annotation"><!-- small supporting annotation block --><p style="font-size:var(--r-left-annotation-font);line-height:1.05;margin:0">left-annotation</p></div>
  <div class="r-hero-name region text" data-region="hero-name"><!-- large two-line MITUL BHATIA display text --><p style="font-size:var(--r-hero-name-font);font-family:var(--r-hero-name-family),sans-serif;font-weight:var(--r-hero-name-weight);line-height:1.05;margin:0">hero-name</p></div>
  <div class="r-hero-description region text" data-region="hero-description"><!-- two-line first-person engineering positioning statement --><p style="line-height:1.05;margin:0">hero-description</p></div>
  <div class="r-primary-action region control" data-region="primary-action"><!-- amber VIEW PROJECTS action: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-secondary-action region control" data-region="secondary-action"><!-- outlined DOWNLOAD RESUME action: rebuild the control's chrome from the crop (comp-spec.mjs --crop secondary-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-left-method-label region text" data-region="left-method-label"><!-- small build observe iterate annotation --><p style="font-size:var(--r-left-method-label-font);line-height:1.05;margin:0">left-method-label</p></div>
  <div class="r-path-field-upper region chrome" data-region="path-field-upper"><!-- responsive mood-state interface paths with sparse right-angle rules and nodes --></div>
  <div class="r-path-field-middle region chrome" data-region="path-field-middle"><!-- responsive mood-state interface paths gathering toward the bot rail --></div>
  <div class="r-path-field-lower region chrome" data-region="path-field-lower"><!-- responsive mood-state interface paths with vertical route rules --></div>
  <div class="r-bot-rail region chrome" data-region="bot-rail"><!-- fixed narrow right-edge MB-01 instrument rail with rules and open trigger --></div>
  <div class="r-bot-face region chrome" data-region="bot-face"><!-- small geometric MB-01 interface icon --></div>
  <div class="r-bot-name region text" data-region="bot-name"><!-- MB-01 label --><p style="font-size:var(--r-bot-name-font);line-height:1.05;margin:0">bot-name</p></div>
  <div class="r-bot-moods region control" data-region="bot-moods"><!-- stacked mood controls with one amber selected marker: rebuild the control's chrome from the crop (comp-spec.mjs --crop bot-moods); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-mood-strip region chrome" data-region="mood-strip"><!-- thin horizontal mood selector strip with section counter --></div>
  <div class="r-mood-strip-labels region control" data-region="mood-strip-labels"><!-- mood names and selected state: rebuild the control's chrome from the crop (comp-spec.mjs --crop mood-strip-labels); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-section-counter region text" data-region="section-counter"><!-- 01 / 05 state counter --><p style="font-size:var(--r-section-counter-font);line-height:1.05;margin:0">section-counter</p></div>
  <div class="r-projects-heading region text" data-region="projects-heading"><!-- below-fold PROJECTS section heading --><p style="line-height:1.05;margin:0">projects-heading</p></div>
  <div class="r-projects-entry region chrome" data-region="projects-entry"><!-- beginning of wide project index row below the first viewport --></div>
</main>
</body>
</html>
