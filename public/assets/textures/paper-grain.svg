<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <filter id="paperFiber" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.65" numOctaves="4" result="fibers" stitchTiles="stitch"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" result="grain" stitchTiles="stitch"/>
    <feComposite in="fibers" in2="grain" operator="arithmetic" k1="0" k2="0.6" k3="0.4" k4="0" result="composite"/>
    <feColorMatrix in="composite" type="matrix" values="
      0 0 0 0 0.17
      0 0 0 0 0.12
      0 0 0 0 0.08
      0 0 0 0 0.045 0" result="coloredNoise"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#paperFiber)"/>
</svg>
